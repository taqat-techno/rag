{% extends "base.html" %}
{% block title %}Dashboard — RAG Tools{% endblock %}
{% block header %}
<h1 class="page-title">Dashboard</h1>
{% endblock %}
{% block actions %}
<a href="/projects" class="btn btn-secondary btn-sm">Manage projects</a>
{% endblock %}
{% block content %}

<div class="stack">

    <form action="/search" method="get" class="dash-search" role="search">
        <label class="sr-only" for="dash-query">Search your knowledge base</label>
        <input type="text" id="dash-query" name="query" class="form-input"
               placeholder="Search your knowledge base…" autofocus>
        <button type="submit" class="btn btn-primary">Search</button>
    </form>

    <div id="dash-status" aria-live="polite"
         hx-get="/ui/dash/status"
         hx-trigger="load, every 60s, rag-invalidate from:body"
         hx-swap="innerHTML">
        <span class="loading-placeholder">Loading index status…</span>
    </div>

    <div id="dash-projects" aria-live="polite"
         hx-get="/ui/dash/projects"
         hx-trigger="load, every 60s, rag-invalidate from:body"
         hx-swap="innerHTML">
        <span class="loading-placeholder">Loading projects…</span>
    </div>

    <div class="card">
        <div class="card-header">Recent activity</div>
        <div id="dash-activity"
             hx-get="/ui/dash/activity"
             hx-trigger="load, every 60s, rag-invalidate from:body"
             hx-swap="innerHTML">
            <span class="loading-placeholder">Loading activity…</span>
        </div>
    </div>

</div>

{% endblock %}
