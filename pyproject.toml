[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ragtools"
version = "3.5.0"
description = "Local Markdown RAG system for Claude CLI"
requires-python = ">=3.10"
dependencies = [
    # Bounded against the SERVER we ship. `PINNED_QDRANT_VERSION` in
    # storage_managed.py pins the engine at 1.15.5, and the client's own rule is
    # that majors must match and the minor gap must not exceed 1 — so 1.14-1.16
    # is the supported window and anything outside it is a shipped mismatch.
    #
    # This was `>=1.12.0` with no upper bound, which is the same defect the `mcp`
    # entry below documents: the two halves of a compatibility-critical pair were
    # pinned by different mechanisms — one a source constant, one an unbounded
    # range resolved fresh at build time — and nothing compared them. v3.2.0
    # therefore shipped client 1.18.0 against server 1.15.5, three minors apart,
    # emitting an incompatibility warning on every single startup, while the
    # developer machine that never re-resolved stayed on 1.17.1 and saw nothing.
    # `scripts/check_qdrant_compat.py` now fails the build before packaging.
    "qdrant-client>=1.14.0,<1.17.0",
    # Declared, not hoped for. Five modules import it opportunistically, and two
    # of the four managed-engine ownership proofs — "the listener is our pid" and
    # "its image is our binary" — silently do not exist without it. It was absent
    # from the v3.2.0 bundle, so whether a security boundary held depended on
    # whether an undeclared package happened to be in the build venv.
    "psutil>=5.9.0",
    "sentence-transformers>=3.0.0",
    "scikit-learn>=1.3.0",  # PCA for the Knowledge Map (was undeclared/transitive — S15 §26.2)
    # `typer[all]` no longer provides that extra (warns on every install);
    # rich is already a direct dependency, which is all it pulled in.
    "typer>=0.12.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "python-frontmatter>=1.0.0",
    "markdown-it-py>=3.0.0",
    "rich>=13.0.0",
    # Capped below 2.0.0 deliberately. `mcp` 2.0.0 (released 2026-07-28)
    # removes `mcp.server.fastmcp`, which this project imports at module
    # level in integration/mcp_server.py — so an unbounded constraint made
    # every FRESH install resolve to a version the MCP server cannot import.
    # Caught by CI the same day: three platform suites failed on a collection
    # error while the developer machine, pinned at 1.27.0, stayed green.
    # Porting to the 2.x API is real work and is not a release blocker; a
    # shipping product that cannot import its own server is.
    "mcp>=1.26.0,<2.0.0",
    "watchfiles>=1.0.0",
    "pathspec>=0.12.0",
    "tomli>=2.0.0; python_version < '3.11'",
    "tomli-w>=1.0.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "httpx>=0.27.0",
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "pytest-cov>=5.0.0", "pytest-asyncio>=0.23.0"]
build = ["pyinstaller>=6.0.0"]
notifications = ["winotify>=1.1.0; sys_platform == 'win32'"]
tray = [
    "pystray>=0.19.5",
    "Pillow>=10.0.0",
]

[project.scripts]
rag = "ragtools.cli:_main"
rag-mcp = "ragtools.integration.mcp_server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ragtools = [
    "service/templates/*.html",
    "service/static/*.css",
    "service/static/*.js",
    "service/static/*.png",
    "service/static/*.ico",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
