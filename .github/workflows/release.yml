name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\pip\Cache
          key: pip-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: pip-${{ runner.os }}-

      - name: Cache SentenceTransformer model
        uses: actions/cache@v4
        with:
          path: build\model_cache
          key: model-build-cache-all-MiniLM-L6-v2-v1

      - name: Install dependencies
        run: pip install -e ".[dev,build,tray]"

      - name: Run tests
        run: pytest -q

      - name: Extract version from tag
        id: version
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build with model
        run: python scripts/build.py

      - name: The built binary must be the tag being released
        # Version injection has failed here before, in the direction that is
        # hardest to see: for v3.0.0-rc.2 the installer filename came from the
        # tag while Inno's version came from a hardcoded literal, the upload
        # glob matched nothing, and the release published with NO installer
        # while every step reported success.
        #
        # Filenames are now derived from the tag, so the remaining risk is the
        # opposite one — a correctly named installer wrapping a bundle built
        # from stale sources. This asks the artifact itself, which is the only
        # thing that can answer.
        shell: bash
        run: |
          built="$(./dist/rag/rag.exe version | tr -d '\r')"
          echo "built:    $built"
          echo "expected: ragtools v${{ steps.version.outputs.version }}"
          test "$built" = "ragtools v${{ steps.version.outputs.version }}"

      - name: Verify the bundle before it becomes an installer
        # Gates the artifact that actually ships, not a rebuild of it. Both
        # properties are invisible to `pytest` and both took the service down
        # in 3.0.0:
        #   * ragw.exe must be GUI-subsystem — if PyInstaller silently built it
        #     console-subsystem, every user gets a terminal window at login and
        #     nothing else in this workflow would notice.
        #   * one .dist-info per distribution — a layered manifest is what made
        #     `transformers` read a safetensors version the bundle never shipped.
        # Failing here costs a re-tag. Failing in the field cost a crash loop.
        run: python scripts/verify_bundle.py --bundle dist/rag --require-windowed

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        # The version comes from the TAG, not from installer.iss. Hardwired, it
        # emitted RAGTools-Setup-3.0.0.exe for tag v3.0.0-rc.2, the upload glob
        # matched nothing, and the release shipped without an installer.
        run: |
          $env:PATH += ";C:\Program Files (x86)\Inno Setup 6"
          iscc /DMyAppVersion=${{ steps.version.outputs.version }} installer.iss

      - name: Create zip of portable bundle
        shell: bash
        run: |
          cd dist
          7z a -tzip "RAGTools-${{ steps.version.outputs.version }}-portable.zip" rag/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: RAG Tools v${{ steps.version.outputs.version }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          # An asset that does not match is a release published WITHOUT it.
          # Unset, this defaults to false: the macOS rename and the installer
          # version drift both shipped incomplete releases that reported success.
          fail_on_unmatched_files: true
          files: |
            dist/RAGTools-Setup-${{ steps.version.outputs.version }}.exe
            dist/RAGTools-${{ steps.version.outputs.version }}-portable.zip

  build-macos:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/pip
          key: pip-${{ runner.os }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: pip-${{ runner.os }}-

      - name: Cache SentenceTransformer model
        uses: actions/cache@v4
        with:
          path: build/model_cache
          key: model-build-cache-all-MiniLM-L6-v2-macos-v1

      - name: Install dependencies
        run: pip install -e ".[dev,build,tray]"

      - name: Run tests
        run: pytest -q

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build with model
        run: python scripts/build.py

      - name: Verify the bundle before it is archived
        # The windowed-executable checks self-skip off Windows; what runs here is
        # the layered-manifest invariant, which is build hygiene on any platform.
        run: python scripts/verify_bundle.py --bundle dist/rag

      - name: Create zip of bundle
        # `macOS-arm64.zip`, not `macos-arm64.tar.gz`. The release gate
        # (/release-ship Phase D) requires
        #     ^RAGTools-X\.Y\.Z-macOS-arm64\.(zip|dmg)$
        # and the old name missed on BOTH case and extension — so a release whose
        # macOS bundle built perfectly would still have been failed for a missing
        # artifact, with nothing in the build log to explain it.
        #
        # `ditto` rather than `zip`: it is the macOS-native archiver and preserves
        # symlinks and extended attributes inside the bundle, which a plain `zip`
        # flattens.
        run: |
          cd dist
          ditto -c -k --sequesterRsrc --keepParent \
            rag "RAGTools-${{ steps.version.outputs.version }}-macOS-arm64.zip"

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: RAG Tools v${{ steps.version.outputs.version }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          # An asset that does not match is a release published WITHOUT it.
          # Unset, this defaults to false: the macOS rename and the installer
          # version drift both shipped incomplete releases that reported success.
          fail_on_unmatched_files: true
          files: |
            dist/RAGTools-${{ steps.version.outputs.version }}-macOS-arm64.zip

  build-linux:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-cpu-${{ hashFiles('pyproject.toml') }}
          restore-keys: pip-${{ runner.os }}-cpu-

      - name: Cache SentenceTransformer model
        uses: actions/cache@v4
        with:
          path: build/model_cache
          key: model-build-cache-all-MiniLM-L6-v2-linux-v1

      - name: Install CPU-only torch
        # PyTorch's default Linux x86_64 wheel pulls in ~2 GB of CUDA runtime
        # (nvidia-cublas, cudnn, cusparse, nccl, etc.) as transitive deps.
        # RAG Tools runs on CPU only, so we install the CPU-only build first
        # — the subsequent ``pip install -e .`` sees torch already satisfies
        # the ``torch>=1.11.0`` constraint and doesn't re-resolve from PyPI.
        # Without this the Linux tar.gz exceeds GitHub's 2 GiB asset limit.
        run: pip install torch --index-url https://download.pytorch.org/whl/cpu

      - name: Install dependencies
        run: pip install -e ".[dev,build,tray]"

      - name: Run tests
        run: pytest -q

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build with model
        run: python scripts/build.py

      - name: Verify the bundle before it is archived
        # See the macOS job: the layered-manifest invariant applies everywhere.
        run: python scripts/verify_bundle.py --bundle dist/rag

      - name: Create tar.gz of bundle
        run: |
          cd dist
          tar -czf "RAGTools-${{ steps.version.outputs.version }}-linux-x86_64.tar.gz" rag/

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: RAG Tools v${{ steps.version.outputs.version }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          # An asset that does not match is a release published WITHOUT it.
          # Unset, this defaults to false: the macOS rename and the installer
          # version drift both shipped incomplete releases that reported success.
          fail_on_unmatched_files: true
          files: |
            dist/RAGTools-${{ steps.version.outputs.version }}-linux-x86_64.tar.gz
